---
name: Dependabot Rebuild Dist

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "issueops-common-logic/package.json"
      - "issueops-common-logic/package-lock.json"
      - "issueops-common-logic/npm-shrinkwrap.json"
permissions:
  contents: write

concurrency:
  group: dependabot-rebuild-dist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebuild-dist:
    name: Rebuild and commit dist
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            issueops-common-logic/package-lock.json
            issueops-common-logic/npm-shrinkwrap.json
      - name: Install dependencies
        working-directory: issueops-common-logic
        run: npm ci

      - name: Build project
        working-directory: issueops-common-logic
        run: npm run bundle

      - name: Commit rebuilt dist
        run: |
          if [ -z "$(git status --porcelain -- issueops-common-logic/dist/)" ]; then
            echo "No dist changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issueops-common-logic/dist/
          git commit -m "chore: rebuild dist for dependabot"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
